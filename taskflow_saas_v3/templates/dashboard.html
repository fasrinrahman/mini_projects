<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - TaskFlow SaaS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h3 class="text-white mb-4">⚡ TaskFlow</h3>

        <a href="/dashboard" class="text-white d-block mb-3">Dashboard</a>
        <a href="/login" class="text-white d-block mb-3">Logout</a>

    </aside>

    <!-- Main -->
    <main class="main-content">

        <h2>Welcome Back 👋</h2>
        <p class="text-muted">Manage your SaaS tasks efficiently</p>

        <!-- Stats -->
        <div class="row mt-4">

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Total Tasks</h5>
                    <h3 id="totalTasks">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Completed</h5>
                    <h3 id="completedTasks">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Pending</h5>
                    <h3 id="pendingTasks">0</h3>
                </div>
            </div>

        </div>

        <!-- Add Task -->
        <div class="card p-3 mt-4">

            <div class="row">

                <div class="col-md-6">
                    <input id="title" class="form-control" placeholder="New Task">
                </div>

                <div class="col-md-3">
                    <select id="status" class="form-control">
                        <option>Pending</option>
                        <option>Completed</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <button onclick="addTask()" class="btn btn-primary w-100">
                        Add Task
                    </button>
                </div>

            </div>

        </div>

        <!-- Task List -->
        <div id="task-list" class="mt-4"></div>

    </main>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
